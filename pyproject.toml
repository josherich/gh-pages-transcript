[project]
name = "gh-transcript-fetch"
version = "0.1.0"
description = "Fetch media transcripts and publish them through GitHub pull requests"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bilibili-api-python>=17.1.3",
    "boto3>=1.38.34",
    "chromadb>=0.6.3",
    "google-api-python-client>=2.160.0",
    "google-auth>=2.38.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.1",
    "google-genai>=1.0.0",
    "langchain-text-splitters>=0.3.8",
    "ollama>=0.4.7",
    "openai>=1.61.1",
    "pydub>=0.25.1",
    "pygithub>=2.5.0",
    "python-fasthtml>=0.12.1",
    "pytube>=15.0.0",
    "requests>=2.32.3",
    "uvicorn>=0.34.0",
    "youtube-transcript-api==1.1.0",
]

[project.scripts]
transcript-web = "gh_transcript_fetch.web:cli"
transcript-worker = "gh_transcript_fetch.worker:cli"

[build-system]
requires = ["setuptools>=74"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gh_transcript_fetch = ["whisper_context.json"]
